<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#102349">
  <title>BaseballPips</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="page">

    <section class="glass card">
      <h1 class="hero__title">BaseballPips</h1>
      <a class="appstore" href="https://apps.apple.com/us/app/baseballpips/id6602899343"><img src="/images/app_store.svg" alt="Download on the App Store"></a>
    </section>

    <div class="glass screens">
      <div class="screens__row" tabindex="0" role="group"
           aria-label="App screenshots, scroll sideways for more">
        <a class="screen" href="/images/screens/full/01-live-widgets.jpg"><img src="/images/screens/01-live-widgets.jpg"
               width="480" height="1040" decoding="async"
               alt="Three iPhone home screen widgets showing 2025 season charts for the Dodgers, Tigers and Mets, each drawn in its own team colors"></a>
        <a class="screen" href="/images/screens/full/02-any-season.jpg"><img src="/images/screens/02-any-season.jpg"
               width="480" height="1040" decoding="async" loading="lazy"
               alt="The Mariners' 2001 season charted as a steady climb, with stats reading 70 games over .500 across 162 games played"></a>
        <a class="screen" href="/images/screens/full/03-throughout-the-year.jpg"><img src="/images/screens/03-throughout-the-year.jpg"
               width="480" height="1040" decoding="async" loading="lazy"
               alt="A Mariners 2025 chart partway through the season, 14 games over .500 at 120 games played"></a>
        <a class="screen" href="/images/screens/full/04-against-the-division.jpg"><img src="/images/screens/04-against-the-division.jpg"
               width="480" height="1040" decoding="async" loading="lazy"
               alt="A Mariners 2025 chart overlaid with a separate line for every other team in the division"></a>
        <a class="screen" href="/images/screens/full/05-your-own-colors.jpg"><img src="/images/screens/05-your-own-colors.jpg"
               width="480" height="1040" decoding="async" loading="lazy"
               alt="The same Mariners 2025 chart recoloured with a custom red palette"></a>
        <a class="screen" href="/images/screens/full/06-postseason.jpg"><img src="/images/screens/06-postseason.jpg"
               width="480" height="1040" decoding="async" loading="lazy"
               alt="Postseason bracket widgets showing NLCS, NLDS and NL Wild Card series results"></a>
      </div>
    </div>

    <hr class="rule">

    <nav class="stack">
      <a class="glass capsule" href="/privacy-policy">
        <svg class="capsule__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2.5 4.5 5.5v5c0 4.5 3.1 8.1 7.5 9.5 4.4-1.4 7.5-5 7.5-9.5v-5L12 2.5Z" />
          <path d="m9 11.5 2.2 2.2 4.3-4.2" />
        </svg>
        <span class="capsule__label">Privacy Policy</span>
        <svg class="capsule__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m9 5 7 7-7 7" />
        </svg>
      </a>

      <a class="glass capsule" href="/support">
        <svg class="capsule__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5.5" width="18" height="13" rx="2.5" />
          <path d="m3.8 7 7.3 5.4a1.5 1.5 0 0 0 1.8 0L20.2 7" />
        </svg>
        <span class="capsule__label">Support</span>
        <svg class="capsule__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m9 5 7 7-7 7" />
        </svg>
      </a>
    </nav>

  </main>

  <dialog id="lightbox" class="lightbox" aria-label="Screenshot">
    <img class="lightbox__img" alt="">
    <button type="button" class="glass lightbox__close" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
    </button>
  </dialog>

  <script>
    (function () {
      var lb = document.getElementById('lightbox');
      // No <dialog> support: leave the tiles as plain links to the full image.
      if (!lb || typeof lb.showModal !== 'function') return;
      var full = lb.querySelector('.lightbox__img');

      document.querySelectorAll('.screen').forEach(function (link) {
        link.addEventListener('click', function (e) {
          e.preventDefault();
          full.src = link.getAttribute('href');
          full.alt = link.querySelector('img').alt;
          lb.showModal();
        });
      });

      lb.addEventListener('click', function (e) {
        if (e.target === lb) lb.close();
      });
      lb.querySelector('.lightbox__close').addEventListener('click', function () {
        lb.close();
      });
      lb.addEventListener('close', function () {
        full.removeAttribute('src');
      });
    })();
  </script>
</body>
</html>
